[package]
name = "flowers-gui"
version = "0.2.0"
edition = "2024"
description = "Flow cytometry analysis in Rust: open-source flow cytometry analysis tool"
license = "MIT"

[dependencies]
flowers = { path = ".." }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
