name: build installers

# Builds the distributable installers:
#   * macOS   -> flowers_<version>_<arch>.dmg   (cargo-packager)
#   * Windows -> flowers_<version>_x64_en-US.msi (WiX v5, via packaging/windows)
#
# Run it manually from the Actions tab, or push a tag such as `v0.2.0` to also
# attach the installers to a GitHub release.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            artifact: flowers-macos-arm64
          - name: macos-x64
            os: macos-15-intel
            artifact: flowers-macos-x64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # cargo-packager is the installer bundler used by Tauri; it packages any
      # native binary, so it fits this egui desktop app. `dmg` needs macOS.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      - name: Build GUI
        run: cargo build --release --bin flowers-gui

      - name: Package
        run: cargo packager --release -f dmg

      - name: Collect installers
        run: |
          mkdir -p artifacts
          cp target/release/*.dmg artifacts/
          ls -l artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*

  windows:
    name: package (windows-x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64

      # WiX v5 is the last free version: v6/v7 refuse to run until the paid
      # Open Source Maintenance Fee licence is accepted.
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Build GUI and package MSI
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/windows/build-msi.ps1

      - name: Collect installers
        run: |
          mkdir artifacts
          copy target\release\*.msi artifacts\
          dir artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: flowers-windows-x64
          path: artifacts/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
